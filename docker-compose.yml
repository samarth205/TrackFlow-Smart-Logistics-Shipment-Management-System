services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trackflow
      MYSQL_USER: trackflow
      MYSQL_PASSWORD: trackflow
      MYSQL_ROOT_PASSWORD: localroot
    ports:
      - "3306:3306"
    volumes:
      - trackflow-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  trackflow-data:
